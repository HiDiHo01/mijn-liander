name: Update requirements

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  update-requirements:
    name: Update pip-compile requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Regenerate requirements files
        run: pip-compile requirements_test.in --upgrade

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements_test.txt
          git commit -m "chore: update requirements_test.txt" || echo "No changes to commit"
          git push

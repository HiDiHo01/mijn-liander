name: Update requirements

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  update-requirements:
    name: Update pip-compile requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade "pip==25.3" "pip-tools==7.6.2"

      - name: Regenerate requirements with hashes
        run: pip-compile requirements_test.in --upgrade --generate-hashes

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements_test.txt
          git commit -m "chore: update requirements_test.txt" || echo "No changes to commit"
          git push

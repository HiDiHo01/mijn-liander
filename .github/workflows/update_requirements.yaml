name: Update requirements

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-requirements:
    name: Update pip-compile requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Regenerate requirements files
        run: pip-compile requirements_test.in --upgrade

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@6d6857d36972b65feb161a90a4f65663f72e06a0 # v6
        with:
          commit-message: "chore: update requirements_test.txt"
          title: "chore: update requirements_test.txt"
          body: "Automated requirements update via pip-compile"
          branch: update-requirements

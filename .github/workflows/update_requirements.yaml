name: Update requirements

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-requirements:
    name: Update pip-compile requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade "pip==25.3" "pip-tools==7.6.2"

      - name: Regenerate requirements with hashes
        run: pip-compile requirements_test.in --upgrade --generate-hashes

      - name: Validate compiled requirements
        run: bash .github/scripts/install-test-dependencies.sh

      - name: Commit and push requirements update
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git checkout -B chore/update-requirements
      
          git add requirements_test.txt
      
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
            exit 0
          fi
      
          git commit -m "chore: update requirements_test.txt"
          git push --force-with-lease origin chore/update-requirements
          echo "changed=true" >> "$GITHUB_OUTPUT"
      
      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view \
            --repo "$GITHUB_REPOSITORY" \
            --head "HiDiHo01:chore/update-requirements" \
            --json number \
            --jq '.number' >/dev/null 2>&1; then
            echo "Pull request already exists"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head chore/update-requirements \
              --title "chore: update requirements_test.txt" \
              --body "Automated update of the pip-compiled test requirements."
          fi

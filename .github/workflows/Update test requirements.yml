name: Update test requirements

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-requirements:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Compile test requirements
        run: |
          pip-compile \
            --generate-hashes \
            --output-file=requirements_test.txt \
            requirements_test.in

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update test requirements"
          title: "chore: update test requirements"
          body: |
            Automatically regenerated `requirements_test.txt`
            with dependency hashes.
          branch: automation/update-test-requirements
          delete-branch: true

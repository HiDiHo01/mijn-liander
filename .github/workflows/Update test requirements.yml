name: Update test requirements

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-requirements:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Compile test requirements
        run: |
          pip-compile \
            --generate-hashes \
            --output-file=requirements_test.txt \
            requirements_test.in

      - name: Create pull request
        uses: peter-evans/create-pull-request@4320041ed380b20e97d388d56a7fb4f9b8c20e79 # v7.0.0
        with:
          commit-message: "chore: update test requirements"
          title: "chore: update test requirements"
          body: |
            Automatically regenerated `requirements_test.txt`
            with dependency hashes.
          branch: automation/update-test-requirements
          delete-branch: true

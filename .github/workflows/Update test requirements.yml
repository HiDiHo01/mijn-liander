name: Update test requirements

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-requirements:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pip-tools
        run: 'python -m pip install --only-binary :all: "pip==24.3.1" "pip-tools==7.4.1"'

      - name: Compile test requirements
        run: |
          pip-compile \
            --generate-hashes \
            --output-file=requirements_test.txt \
            requirements_test.in

      - name: Validate compiled requirements
        run: bash .github/scripts/install-test-dependencies.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update test requirements"
          title: "chore: update test requirements"
          body: |
            Automatically regenerated `requirements_test.txt`
            with dependency hashes.
          branch: automation/update-test-requirements
          delete-branch: true
